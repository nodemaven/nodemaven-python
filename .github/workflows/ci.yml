# The test suite, on every Python this package claims to support.
#
# It installs the package and runs the tests against the installed copy rather
# than against `src/`. That is the whole reason this is worth running: the two
# things most likely to break a release are invisible from the source tree.
# `data/providers/*.toml` is package data, and a wheel that omits it imports
# fine and then fails on the first `load()`; `tomli` is a dependency only below
# 3.11, so a missing marker is invisible on a modern interpreter and breaks 3.9
# and 3.10 alone. Both were checked by hand in a clean virtualenv before 0.1.0
# went out - this is that check, on five interpreters, without the hand.
#
# The suite is offline in full and strips the gateway variables from the
# environment, so it needs no credentials and cannot spend traffic.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        # One Windows job, because the package is developed there and a path
        # separator or an encoding difference would otherwise be found by a
        # user. Not the whole grid: it buys little and costs the queue.
        include:
          - python-version: "3.11"
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pytest
      - run: python -m pytest -q

  # One name for the branch ruleset to require, instead of the six matrix jobs.
  #
  # A required status check is matched by name, and a name that stops being
  # produced never reports - so a pull request waits on it forever. Requiring
  # `test (3.9, ubuntu-latest)` directly means that dropping 3.9 from the matrix
  # above silently blocks every pull request in the repository, and the ruleset
  # is somewhere nobody edits when they edit this file. This job's name does not
  # depend on the matrix, so the two cannot drift.
  #
  # `if: always()` with an explicit result check, and not a bare `needs:`. A
  # skipped or cancelled dependency leaves a plain `needs:` job skipped rather
  # than failed, and a skipped required check is treated as passing - which is
  # the same hole in the other direction.
  ci-ok:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: every matrix job succeeded
        run: |
          echo "test -> ${{ needs.test.result }}"
          test "${{ needs.test.result }}" = "success"
