[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nodemaven"
dynamic = ["version"]
description = "Build and validate proxy connection strings. No transport, no retries."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NodeMaven", email = "alexandr.kazmin@nodemaven.com" }]
keywords = ["proxy", "residential-proxy", "scraping", "http-proxy", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = ["tomli>=1.1.0; python_version < '3.11'"]

[project.urls]
# These render as the sidebar on the PyPI page, so every one of them has to answer
# 200 to a logged-out visitor. Checked 2026-08-25.
# `Source` is deliberately absent: nodemaven/nodemaven-python is internal and
# answers 404 anonymously, exactly as a repository that does not exist does. Add it
# in the same commit that makes the repository public, not before.
Homepage = "https://nodemaven.com"
Documentation = "https://docs.nodemaven.com"

[tool.setuptools.dynamic]
version = { attr = "nodemaven.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nodemaven = ["py.typed", "data/providers/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
