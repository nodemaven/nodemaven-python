# NodeMaven.
#
# `status = "measured"` means this dialect was read off the wire rather than
# copied out of documentation: every value below was confirmed by raw CONNECT
# probes on the date recorded. A definition marked `documented` has never been
# exercised, and the difference matters because a wrong username is invisible -
# see `notes`.
label = "NodeMaven"
status = "measured"
source = "dashboard proxy generator, plus raw CONNECT probes"
source_read = "2026-08-12"

# <login>-country-us-sid-abc123-ttl-10m
prefix = "{login}"
separator = "-"
pair_separator = "-"
session_param = "sid"

host = "gate.nodemaven.com"
port = 8080

# Returned on the CONNECT reply, so an exit address costs one handshake and no
# target traffic. Not guaranteed: more than one implementation answers on this
# name, and only some of them send it, so handle its absence rather than
# treating the first miss as an error.
exit_ip_header = "X-Proxy-Exit-IP"

# Confirmed to be recognised. Anything outside this set is refused before a
# request exists, because the gateway answers an unknown name with 200 and the
# setting silently dropped.
#
# `norotate` was added to this list on 2026-08-21 and taken back out on
# 2026-08-26, and the round trip is worth keeping because the reasoning that put
# it here is a mistake this file is otherwise built to prevent.
#
# It was added on provenance: it appears in the vendor's own proxy generator,
# which emits `...-sid-<id>-filter-medium-norotate-true`, the same way `speed`
# turned up on 2026-08-12. The note written at the time said it "cannot be found
# by probing", because an unrecognised name and a name we have not heard of
# produce identical evidence - a 200 with the setting dropped. That sentence was
# treated as a limitation of probing. It was not. It was the one observation
# available, and it pointed the other way.
#
# Probed from the VPS on 2026-08-26 against gate.nodemaven.com:8080, three ways,
# each carrying a negative control with a name nobody could have implemented and
# a positive control on `filter`:
#
#   junk value            200, exactly as the unknown name is answered
#   no sid, 6 draws       6 distinct exits of 6, exactly as both controls
#   fixed sid, ttl=1m,    3 distinct exits of 3, exactly as both controls
#   sampled 0/78/157 s
#
# So the gateway answers 200 and drops it, which is what this file said before
# 2026-08-21. Rotation is what `norotate` claims to change, and it does not
# change it; that is a measurement of the effect, not of the name.
#
# `speed` sits on the same provenance and has never been probed for its effect.
# It stays for now because removing it on inference would be the same error in
# the other direction. It is a probe waiting to be run, not a confirmed entry.
known_params = ["country", "region", "city", "isp", "sid", "ttl", "filter",
                "ipv4", "speed"]

# Legal values per parameter, checked before anything is sent.
#
# Deliberately empty. An entry here is a refusal, so a wrong entry blocks a
# setting the gateway would have accepted, and that is worse than the gap it
# closes. What is known as of 2026-08-21 is which values the vendor's proxy
# generator *emits* - `filter` as `medium`, `speed` as `fast`, `country` as
# `any` or a code - and that is a sample of one UI's output, not the set the
# gateway accepts. The two are only the same if the generator can emit
# everything, which nobody has checked.
#
# The generator is not a source of truth about the gateway at all. It also emits
# `norotate`, and the gateway drops it - see the note on `known_params`.
#
# The key exists anyway, and that is the point: four language SDKs read this
# schema. Filling this in later is an edit to a data file. Adding the key
# later would be an edit to four parsers.
#
# Lists only, never a regular expression - see the note in providers.py.
#
# Written inline rather than as a `[values]` table on purpose: a table header
# here would swallow every key below it, starting with `notes`.
values = {}

notes = """
Measured 2026-08-10 by raw CONNECT probes.

Sticky sessions key on the whole recognised parameter set, not on `sid` alone.
`country=us, sid=A` and `country=us, sid=A, filter=medium` are two different
sessions; `ttl` does not participate and `filter` does. Adding or removing any
parameter moves you to another exit without saying so.

Seven inputs, seven reactions, none of which names the cause:
  bad country          406 Not Acceptable
  bad region           406 Not Acceptable
  bad city             500 Internal Server Error
  bad filter value     407 Proxy Authentication Required
  bad ttl value        407 Proxy Authentication Required
  empty value          no reply, the connection hangs about 20 s
  unknown parameter    200, the parameter is ignored

The two 407 cases are actively misleading - they send you to check credentials
that are correct. With no `country` the default country is not stable.
"""
